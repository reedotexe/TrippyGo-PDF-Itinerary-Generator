name: Production Deployment Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy-production:
    name: Build, Migrate & Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # Pre-deployment Database Migration
      - name: Run Drizzle Database Migrations Against Production DB
        if: ${{ env.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx drizzle-kit migrate

      # Docker Build & Push to GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Web Application Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push PDF Renderer Microservice Container
        uses: docker/build-push-action@v5
        with:
          context: ./services/renderer
          file: ./services/renderer/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/renderer:latest
            ghcr.io/${{ github.repository }}/renderer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Production Release Notification / Deployment Webhook Hook
      - name: Trigger Production Deployment Hook
        if: ${{ env.DEPLOY_WEBHOOK_URL != '' }}
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          echo "Triggering deployment webhook to update live service cluster..."
          curl -X POST -H "Content-Type: application/json" -d '{"event":"release","sha":"${{ github.sha }}"}' "$DEPLOY_WEBHOOK_URL"
