name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Lint, Type Check & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium & System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Strict Type Check
        run: npx tsc --noEmit

      - name: Run Unit Tests & Security Suite
        run: |
          npm run test:unit
          npm run test:dates
          npm run test:security

      - name: Run Supplier Extraction Pipeline Test Harness
        run: npm run test:extraction

      - name: Run Automated PDF Net Rate & Markup Leak Test
        run: npm run test:leak

      - name: Run Visual Regression Reference Audit
        run: npm run test:visual

      - name: Run Full End-to-End Playwright Workflow Test
        run: npm run test:e2e

  docker-build:
    name: Validate Docker Container Builds
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web Application Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: trippygo-web:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build PDF Renderer Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./services/renderer
          file: ./services/renderer/Dockerfile
          push: false
          tags: trippygo-renderer:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
